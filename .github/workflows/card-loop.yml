name: Карточка с аватарками

# Пересобирает зацикленное видео, когда меняются аватарки или сама карточка.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "avatars/**"
      - "tools/card-loop/**"
      - ".github/workflows/card-loop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-loop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Собрать цикл
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/card-loop/build.mjs

      - name: Закоммитить, если карточка изменилась
        run: |
          if git diff --quiet -- preview/card-loop.mp4 preview/card-loop.gif; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/card-loop.mp4 preview/card-loop.gif
          git commit -m "Карточка с аватарками: автообновление"
          git push
